<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 3</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-size: 2rem;
        display: flex;
        flex-flow: column;
        justify-content: center;
        align-items: center;
      }

      h2 {
        font-weight: 400;
        margin: 0;
      }

      .container {
        width: 600px;
        height: 600px;
        background-color: antiquewhite;
        justify-items: center;
        align-content: center;

        .item {
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100px;
          height: 100px;
          background-color: aquamarine;
          border-radius: 0.5rem;
          box-shadow: 3px 3px 4px black;
        }
      }
    </style>
  </head>
  <body>
    <h2>Container</h2>
    <div class="container">
      <div class="item">Item</div>
    </div>
  </body>
</html>
