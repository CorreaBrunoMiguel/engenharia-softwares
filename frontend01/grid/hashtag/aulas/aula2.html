<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 01 - Grid</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      html {
        font-size: 62.5%;
      }

      .grid {
        width: 90rem;
        display: grid;
        margin: 2rem auto;
        grid-auto-flow: column;
        /* grid-auto-rows: 30rem 40rem */
        grid-template-rows: repeat(3, 1fr); /* 1fr 1fr 1fr */

        div {
          width: 30rem;
          height: 30rem;
          border: 1px solid black;
        }

        .div1 {
          background-color: red;
        }
        .div2 {
          background-color: blue;
        }
        .div3 {
          background-color: green;
        }
        .div4 {
          background-color: yellow;
        }
        .div5 {
          background-color: orange;
        }
        .div6 {
          background-color: aqua;
        }
        .div7 {
          background-color: brown;
        }
        .div8 {
          background-color: gold;
        }
        .div9 {
          background-color: violet;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="div1"></div>
      <div class="div2"></div>
      <div class="div3"></div>
      <div class="div4"></div>
      <div class="div5"></div>
      <div class="div6"></div>
      <div class="div7"></div>
      <div class="div8"></div>
      <div class="div9"></div>
    </div>
  </body>
</html>
